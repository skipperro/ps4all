services:
  egl:
    container_name: ps4all
    hostname: ps4all
    image: ps4all
    build:
      context: .
      entitlements:
        - security.insecure
    # NVIDIA GPUs: the NVIDIA Container Toolkit (v1.20.1 or higher) runtime and
    # a device reservation; other GPUs are passed as devices instead (see below)
    runtime: nvidia
    # IMPORTANT FOR PROTON
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined

    ports:
    - '8080:8080'
    # Internal TURN server ports, for the WebRTC transport without host networking
#    - '3478:3478'
#    - '65532-65535:65532-65535'
#    - '3478:3478/udp'
#    - '65532-65535:65532-65535/udp'
    stdin_open: true
    tty: true
    # The browsers inside the desktop crash on Docker's 64 MB default
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    # AMD and Intel GPUs (drop `runtime: nvidia` and the reservation above): the
    # DRM nodes, which the session user must be able to open
    #devices:
    #  - '/dev/dri:/dev/dri'
    volumes:
      - ./app:/home/ubuntu/app:rw
      - ./mangohud:/home/ubuntu/.config/MangoHud:ro
      - .cache/umu:/home/ubuntu/.local/share/umu/:rw
      - .cache/appdata:/home/ubuntu/wineprefix/drive_c/users/steamuser/AppData/:rw
      - .cache/nvidia:/home/ubuntu/.cache/nvidia/:rw

    # Uncomment to disable network isolation, which the WebRTC transport needs
    # without a TURN server; display `:20` must then be free on the host
#    network_mode: 'host'
    environment:
    - TZ=UTC
    - SELKIES_WAYLAND=false
    - SELKIES_ENABLE_BASIC_AUTH=false
    - SELKIES_ENABLE_HTTPS=true

    # Defaults for testing

    - SELKIES_MODE=websocket
    - SELKIES_ENCODER=h264enc
    - SELKIES_VIDEO_FULLCOLOR=false
    - SELKIES_FRAMERATE=60,30-60
    - SELKIES_VIDEO_BITRATE=10000,1000-30000
    - SELKIES_RATE_CONTROL_MODE=cbr
    - SELKIES_AUDIO_ENABLED=true
    - SELKIES_AUDIO_BITRATE=256
    - SELKIES_AUDIO_CHANNELS=2
    - SELKIES_AUDIO_FRAME_DURATION_MS=60
    - SELKIES_GAMEPAD_ON_START=false
    - SELKIES_GAMEPAD_ENABLED=false
    - SELKIES_UI_SHOW_CORE_BUTTONS=false
    - SELKIES_UI_SIDEBAR_SHOW_CLIPBOARD=false
 #   - SELKIES_UI_SIDEBAR_SHOW_FILES=false
    - SELKIES_UI_SIDEBAR_SHOW_APPS=false
    - SELKIES_UI_SIDEBAR_SHOW_SHARING=false
    - SELKIES_UI_SIDEBAR_SHOW_GAMEPADS=false
    - SELKIES_UI_SIDEBAR_SHOW_WEBCAM=false
#    - SELKIES_RUN_AFTER_CONNECT=/bin/bash -lc "cd /home/ubuntu && exec mangohud umu-run /home/ubuntu/app/ccg_RoyalEnfield/Binaries/Win64/ccg_RoyalEnfield-Win64-Shipping.exe > /tmp/umu-logs.log 2>&1"
#    - SELKIES_RUN_AFTER_DISCONNECT=killall umu-run
#    - START_PLASMA=false

